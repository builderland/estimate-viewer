<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적 보고서</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: sans-serif; }

  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    color: #666;
    font-size: 14px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e0e0e0;
    border-top-color: #333;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 12px;
    color: #d93025;
    font-size: 14px;
    text-align: center;
    padding: 2rem;
  }

  #content { display: none; width: 100%; }

  iframe {
    width: 100%;
    height: 100vh;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>보고서 불러오는 중...</span>
</div>

<div id="error">
  <span style="font-size:32px;">⚠</span>
  <span id="error-msg">보고서를 불러올 수 없습니다.</span>
  <span id="error-sub" style="color:#999;font-size:12px;">URL이 만료됐거나 잘못된 링크입니다.</span>
</div>

<div id="content">
  <iframe id="report-frame" sandbox="allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>
</div>

<script>
// 리포트 주소는 ?c=<8자 코드>로 받는다. 코드는 upload_requests.short_code 이고,
// get_report_by_code RPC가 report_path 만 돌려준다(이름·전화번호 등은 나오지 않는다).
// anon 키는 mmmh.kr 전 페이지에 이미 공개된 값이라 여기 두어도 새로 열리는 권한은 없다.
const SUPABASE_URL = 'https://zzczkrnninvyyxwdicck.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6Y3prcm5uaW52eXl4d2RpY2NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNzQxMTEsImV4cCI6MjA4NzY1MDExMX0.mgzgnSoSGIOKi2tJe-C_BNfdroH7rZs6fsm8c4KV0Pg';

// 변경: 보조 문구도 상황에 맞춘다.
//  이전엔 "URL이 만료됐거나 잘못된 링크입니다."가 고정이라, 링크는 멀쩡한데 표시에만
//  실패한 경우(타임아웃·네트워크)에도 고객에게 링크가 잘못됐다고 잘못 안내했다.
const SUB_BAD_LINK = 'URL이 만료됐거나 잘못된 링크입니다.';
const SUB_RETRY = '잠시 후 다시 시도해 주세요.';

(async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('c');

  if (!code) {
    showError('잘못된 링크입니다.');
    return;
  }

  let fileUrl;
  try {
    const lookup = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_report_by_code', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_code: code }),
    });
    if (!lookup.ok) throw new Error('HTTP ' + lookup.status);

    // 코드가 없거나 아직 보고서가 올라가지 않은 건이면 null
    const reportPath = await lookup.json();
    if (!reportPath) {
      showError('리포트를 찾을 수 없습니다. 링크를 다시 확인해 주세요.');
      return;
    }
    fileUrl = SUPABASE_URL + '/storage/v1/object/public/reports/' + reportPath;
  } catch(e) {
    showError('링크를 확인하지 못했습니다.', SUB_RETRY);
    return;
  }

  try {
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const html = await res.text();

    // 변경: blob: URL 대신 srcdoc.
    //  샌드박스 iframe에 blob:을 넣으면 iOS Safari·카카오톡 등 인앱 브라우저가 로드를 막는다.
    //  그러면 onload가 오지 않고, 로딩 화면을 지우는 코드가 거기에만 있어 "불러오는 중"에서 멈췄다.
    const frame = document.getElementById('report-frame');

    // 변경: onload가 끝내 오지 않아도 무한 로딩으로 남지 않도록 안전장치.
    const failsafe = setTimeout(() => {
      showError('보고서를 표시하지 못했습니다. 채널로 문의해 주세요.', SUB_RETRY);
    }, 8000);

    frame.onload = () => {
      clearTimeout(failsafe);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    };
    frame.srcdoc = html;
  } catch(e) {
    // 변경: 'HTTP 404' 같은 원문을 고객 화면에 그대로 띄우지 않는다(진단은 콘솔로).
    console.error('report load failed', e);
    showError('보고서를 표시하지 못했습니다. 채널로 문의해 주세요.', SUB_RETRY);
  }
})();

function showError(msg, sub = SUB_BAD_LINK) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-sub').textContent = sub;
  document.getElementById('error').style.display = 'flex';
}
</script>
</body>
</html>
