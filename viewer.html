<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적 보고서</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: sans-serif; }

  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    color: #666;
    font-size: 14px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e0e0e0;
    border-top-color: #333;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 12px;
    color: #d93025;
    font-size: 14px;
    text-align: center;
    padding: 2rem;
  }

  #content { display: none; width: 100%; }

  iframe {
    width: 100%;
    height: 100vh;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>보고서 불러오는 중...</span>
</div>

<div id="error">
  <span style="font-size:32px;">⚠</span>
  <span id="error-msg">보고서를 불러올 수 없습니다.</span>
  <span style="color:#999;font-size:12px;">URL이 만료됐거나 잘못된 링크입니다.</span>
</div>

<div id="content">
  <iframe id="report-frame" sandbox="allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>
</div>

<script>
// 리포트 주소는 ?c=<8자 코드>로 받는다. 코드는 upload_requests.short_code 이고,
// get_report_by_code RPC가 report_path 만 돌려준다(이름·전화번호 등은 나오지 않는다).
// anon 키는 mmmh.kr 전 페이지에 이미 공개된 값이라 여기 두어도 새로 열리는 권한은 없다.
const SUPABASE_URL = 'https://zzczkrnninvyyxwdicck.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6Y3prcm5uaW52eXl4d2RpY2NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNzQxMTEsImV4cCI6MjA4NzY1MDExMX0.mgzgnSoSGIOKi2tJe-C_BNfdroH7rZs6fsm8c4KV0Pg';

(async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('c');

  if (!code) {
    showError('잘못된 링크입니다.');
    return;
  }

  let fileUrl;
  try {
    const lookup = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_report_by_code', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_code: code }),
    });
    if (!lookup.ok) throw new Error('HTTP ' + lookup.status);

    // 코드가 없거나 아직 보고서가 올라가지 않은 건이면 null
    const reportPath = await lookup.json();
    if (!reportPath) {
      showError('리포트를 찾을 수 없습니다. 링크를 다시 확인해 주세요.');
      return;
    }
    fileUrl = SUPABASE_URL + '/storage/v1/object/public/reports/' + reportPath;
  } catch(e) {
    showError('링크를 확인하지 못했습니다.');
    return;
  }

  try {
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const html = await res.text();
    const blob = new Blob([html], { type: 'text/html; charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);

    const frame = document.getElementById('report-frame');
    frame.src = blobUrl;
    frame.onload = () => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    };
  } catch(e) {
    showError(e.message);
  }
})();

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error').style.display = 'flex';
}
</script>
</body>
</html>
